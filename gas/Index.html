<body>
<header class="topbar topbar-end">
  <div class="topbar-actions">
    <span id="last-updated" class="muted"></span>
    <button id="refresh-btn" class="btn">🔄 最新の株価に更新</button>
  </div>
</header>

<main>
  <section class="card summary-card hidden">
    <div class="summary-grid">
      <div class="summary-col">
        <div class="summary-row">
          <span class="label">評価額合計(保有中)</span>
          <span class="value" id="sum-market-value">¥0</span>
        </div>
        <div class="summary-row">
          <span class="label">下落アラート銘柄</span>
          <span class="value small" id="sum-alert-count">0件</span>
        </div>
      </div>
      <div class="summary-col">
        <div class="summary-row">
          <span class="label">評価損益合計</span>
          <span class="value" id="sum-unrealized">±¥0</span>
        </div>
        <div class="summary-row">
          <span class="label">実現損益合計</span>
          <span class="value small" id="sum-realized">±¥0</span>
        </div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>取引を記録</h2>
    <form id="add-form" class="add-form">
      <div class="field">
        <label>証券コード / ティッカー</label>
        <input type="text" name="ticker" placeholder="例: 7203 または AAPL" required>
      </div>
      <div class="field">
        <label>銘柄名(任意)</label>
        <input type="text" name="name" placeholder="自動取得も可">
      </div>
      <div class="field">
        <label>区分</label>
        <select name="side">
          <option value="buy">購入</option>
          <option value="sell">売却</option>
        </select>
      </div>
      <div class="field">
        <label>株数</label>
        <input type="number" name="quantity" value="100" min="0" step="1" required>
      </div>
      <div class="field">
        <label>単価</label>
        <input type="number" name="price" step="0.01" required>
      </div>
      <div class="field">
        <label>日付</label>
        <input type="date" name="date" required>
      </div>
      <div class="field wide">
        <label>メモ</label>
        <input type="text" name="memo" placeholder="購入・売却の理由など">
      </div>
      <button type="submit" class="btn primary">記録する</button>
    </form>
  </section>

  <section class="card" style="padding:0;">
    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="stocks">銘柄一覧 (<span id="stocks-count">0</span>)</button>
      <button type="button" class="tab-btn" data-tab="history">取引履歴 (<span id="history-count">0</span>)</button>
    </div>

    <div class="tab-panel" id="panel-stocks">
      <div class="panel-toolbar">
        <div class="toolbar-left">
          <label class="filter-check"><input type="checkbox" id="holding-only-check"> 保有中のみ表示</label>
          <label class="sort-select-wrap">並び順:
            <select id="sort-select">
              <option value="alert">🔻アラート優先</option>
              <option value="name">銘柄名順</option>
              <option value="change_asc">騰落率が低い順</option>
              <option value="change_desc">騰落率が高い順</option>
              <option value="pnl_desc">評価損益が大きい順</option>
              <option value="pnl_asc">評価損益が小さい順</option>
              <option value="qty_desc">保有株数が多い順</option>
              <option value="recent">直近取引が新しい順</option>
            </select>
          </label>
        </div>
        <span class="muted">現在値が平均取得単価(保有中)または前回売却価格(売却済み)から-15%以上下がった銘柄には🔻が付きます</span>
      </div>
      <p id="stocks-empty" class="muted hidden">まだ取引がありません。</p>
      <div class="table-wrap">
      <table class="stock-table" id="stocks-table">
        <thead>
          <tr>
            <th class="col-name">銘柄</th>
            <th>保有株数</th>
            <th>取得単価</th>
            <th>現在値</th>
            <th>評価額</th>
            <th>評価損益</th>
            <th>実現損益</th>
            <th>騰落</th>
            <th class="col-name">直近の取引</th>
          </tr>
        </thead>
        <tbody id="stocks-body"></tbody>
      </table>
      </div>
    </div>

    <div class="tab-panel hidden" id="panel-history">
      <p id="history-empty" class="muted hidden">まだ取引がありません。</p>
      <div class="table-wrap">
      <table class="stock-table" id="history-table">
        <thead>
          <tr>
            <th class="col-name">銘柄</th>
            <th>日付</th>
            <th>区分</th>
            <th>株数</th>
            <th>単価</th>
            <th>金額</th>
            <th class="col-name">メモ</th>
            <th class="col-actions">操作</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
      </div>
    </div>
  </section>
</main>

<div id="chart-modal" class="modal hidden">
  <div class="modal-content">
    <button id="modal-close" class="btn small">✕ 閉じる</button>
    <h3 id="modal-title"></h3>
    <canvas id="price-chart" height="120"></canvas>
  </div>
</div>

<div id="loading-overlay" class="loading hidden">読み込み中...</div>
